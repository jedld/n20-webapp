name: Python Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout webapp
        uses: actions/checkout@v4

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NATURAL20_ENGINE_REPO || 'jedld/natural_20.py' }}
          path: natural_20.py

      # Several webapp tests load campaigns from user_levels/ relative to the
      # repo root (Session(root_path='user_levels/...')) or from the parent of
      # the webapp checkout (dirname(tests/webapp/x.py)/../../..). The
      # campaigns repo is private: expose it via the read-only deploy key
      # secret N20_CAMPAIGNS_SSH_KEY (add one under Settings -> Deploy keys).
      - name: Checkout campaigns
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.N20_CAMPAIGNS_REPO || 'jedld/n20-campaigns' }}
          path: user_levels
          ssh-key: ${{ secrets.N20_CAMPAIGNS_SSH_KEY }}
          lfs: true

      - name: Expose campaigns to parent-path tests
        run: ln -s "$GITHUB_WORKSPACE/user_levels" "$(dirname "$GITHUB_WORKSPACE")/user_levels"

      # Many webapp tests load engine fixtures via Session(root_path='tests/fixtures')
      # relative to CWD, and some resolve them relative to the checkout's parent
      # (dirname(tests/webapp/x.py)/../../..). The standalone webapp checkout has no
      # tests/fixtures tree of its own, so symlink the engine's fixtures into both
      # locations the tests probe (same trick as user_levels above).
      - name: Expose engine test fixtures
        run: |
          ln -sfn "$GITHUB_WORKSPACE/natural_20.py/tests/fixtures" "$GITHUB_WORKSPACE/tests/fixtures"
          mkdir -p "$(dirname "$GITHUB_WORKSPACE")/tests"
          ln -sfn "$GITHUB_WORKSPACE/natural_20.py/tests/fixtures" "$(dirname "$GITHUB_WORKSPACE")/tests/fixtures"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e natural_20.py
          pip install -e ".[dev]"

      - name: Run webapp tests
        run: pytest tests/webapp -q --dist=worksteal -n 1
        env:
          TEMPLATE_DIR: ${{ github.workspace }}/natural_20.py/templates
