name: Python Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Many webapp tests assume the monorepo layout (engine root with
      # tests/fixtures, templates/ and user_levels/, webapp as the n20-webapp/
      # subdirectory): Session(root_path='tests/fixtures') and 'templates' are
      # CWD-relative, and helpers/test paths walk up via
      # dirname(tests/webapp/x.py)/../../.. . Reproduce that layout exactly:
      # check the engine out first, then this repo inside it, then campaigns.
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NATURAL20_ENGINE_REPO || 'jedld/natural_20.py' }}
          path: natural_20.py

      - name: Checkout webapp
        uses: actions/checkout@v4
        with:
          path: natural_20.py/n20-webapp

      # The campaigns repo is private: expose it via the read-only deploy key
      # secret N20_CAMPAIGNS_SSH_KEY (add one under Settings -> Deploy keys).
      - name: Checkout campaigns
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.N20_CAMPAIGNS_REPO || 'jedld/n20-campaigns' }}
          path: natural_20.py/user_levels
          ssh-key: ${{ secrets.N20_CAMPAIGNS_SSH_KEY }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e natural_20.py
          pip install -e "natural_20.py/n20-webapp[dev]"

      # Same command/CWD as the parent repo's webapp CI job.
      - name: Run webapp tests
        working-directory: natural_20.py
        run: pytest n20-webapp/tests/webapp -q --dist=worksteal -n 1
        env:
          TEMPLATE_DIR: ${{ github.workspace }}/natural_20.py/templates
