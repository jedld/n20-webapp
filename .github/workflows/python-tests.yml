name: Python Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout webapp
        uses: actions/checkout@v4

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NATURAL20_ENGINE_REPO || 'jedld/natural_20.py' }}
          path: natural_20.py

      # Several webapp tests load campaigns from user_levels/ relative to the
      # repo root (Session(root_path='user_levels/...')) or from the parent of
      # the webapp checkout (dirname(tests/webapp/x.py)/../../..). The
      # campaigns repo is private: expose it via the read-only deploy key
      # secret N20_CAMPAIGNS_SSH_KEY (add one under Settings -> Deploy keys).
      - name: Checkout campaigns
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.N20_CAMPAIGNS_REPO || 'jedld/n20-campaigns' }}
          path: user_levels
          ssh-key: ${{ secrets.N20_CAMPAIGNS_SSH_KEY }}
          lfs: true

      - name: Expose campaigns to parent-path tests
        run: ln -s "$GITHUB_WORKSPACE/user_levels" "$(dirname "$GITHUB_WORKSPACE")/user_levels"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e natural_20.py
          pip install -e ".[dev]"

      - name: Run webapp tests
        run: pytest tests/webapp -q --dist=worksteal -n 1
        env:
          TEMPLATE_DIR: ${{ github.workspace }}/natural_20.py/templates
