name: JavaScript Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # path_compute.test.js loads path_compute_vectors.json from the engine's
      # tests/fixtures tree (shared with the Python suite). The engine repo is
      # public, so no deploy key is needed for this read-only checkout.
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NATURAL20_ENGINE_REPO || 'jedld/natural_20.py' }}
          path: natural_20.py

      - name: Expose engine test fixtures
        run: |
          ln -sfn "$GITHUB_WORKSPACE/natural_20.py/tests/fixtures" "$GITHUB_WORKSPACE/tests/fixtures"
          mkdir -p "$(dirname "$GITHUB_WORKSPACE")/tests"
          ln -sfn "$GITHUB_WORKSPACE/natural_20.py/tests/fixtures" "$(dirname "$GITHUB_WORKSPACE")/tests/fixtures"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run ci:test
