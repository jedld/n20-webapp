<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Combat Log</title>
    <link href="/libs/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ asset_url('styles.css') }}" rel="stylesheet">
    <script src="/libs/jquery/jquery-3.2.1.min.js"></script>
    <script src="/libs/socket.io/socket.io.min.js"></script>
    <script src="/libs/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="/combat-log.js"></script>
</head>
<body data-username="{{ username }}" data-role="{{ role }}">
    <div class="container">
        <h1>Combat Log</h1>
        <div id="console" class="console">
            <!-- Combat log messages will be dynamically inserted here -->
        </div>
        <button id="refresh-log" class="btn btn-primary" style="margin-top: 20px;">Refresh Log</button>
        <button id="copy-log" class="btn btn-default" style="margin-top: 20px;">Copy Log</button>
    </div>
    <script>
        $(document).ready(function() {
            // Function to fetch and display combat log messages
            function fetchCombatLog() {
                // Fetch combat log messages from the server
                $.get('/api/combat-log', function(data) {
                    $('#console').empty();
                    data.combat_log.forEach(function(item) {
                        $('#console').append('<p>' + item.message + '</p>');
                    });
                });
            }

            // Copy the whole log (as plain text, one message per line)
            function copyCombatLog() {
                var lines = $('#console p').map(function() {
                    return $(this).text();
                }).get().join('\n');
                var $button = $('#copy-log');
                function flash(label) {
                    var original = $button.data('label') || $button.text();
                    $button.data('label', original).text(label);
                    setTimeout(function() { $button.text(original); }, 1500);
                }
                function legacyCopy() {
                    var $tmp = $('<textarea>').val(lines).css({
                        position: 'fixed', top: 0, left: -9999
                    }).appendTo(document.body);
                    $tmp[0].select();
                    var ok = false;
                    try { ok = document.execCommand('copy'); } catch (e) {}
                    $tmp.remove();
                    flash(ok ? 'Copied!' : 'Copy failed');
                }
                if (!lines) {
                    flash('Log is empty');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(lines)
                        .then(function() { flash('Copied!'); })
                        .catch(legacyCopy);
                } else {
                    legacyCopy();
                }
            }

            // Initial fetch of combat log messages
            fetchCombatLog();

            // Refresh log button click event
            $('#refresh-log').click(function() {
                fetchCombatLog();
            });

            // Copy log button click event
            $('#copy-log').click(copyCombatLog);
        });
    </script>
</body>
</html>
