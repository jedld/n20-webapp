<div class="teleporter-marker"
     data-object-id="{{ obj['id'] }}"
     data-destination="{{ obj['teleporter_destination']|e }}"
     {% if obj.get('teleporter_party_travel') %}data-party-travel="1"{% endif %}
     title="{% if obj.get('teleporter_party_travel') %}Travel with party → {{ obj['teleporter_destination']|e }}{% else %}{{ obj['teleporter_destination']|e }}{% endif %}"
     style="--teleporter-marker-color: {{ obj['teleporter_marker_color'] }};">
  <span class="teleporter-marker-label">{{ obj['teleporter_destination'] }}</span>
</div>
