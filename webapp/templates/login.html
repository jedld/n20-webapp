<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/libs/bootstrap/3.3.7/css/bootstrap.min.css">
    {% if google_fonts_url %}
    <link rel="stylesheet" href="{{ google_fonts_url }}">
    {% endif %}
    <!-- jQuery (must be loaded before Bootstrap JS) -->
    <script src="/libs/jquery/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="/libs/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <style>
{{ page_css|safe }}
        .login-panel .form-group {
            margin-bottom: 20px;
        }
        .login-panel .login-error {
            margin-top: 16px;
            border-radius: 6px;
            padding: 10px 12px;
        }
    </style>
    <script>
    $(document).ready(function() {
      $('#loginForm').on('submit', function(e) {
        e.preventDefault();

        $.ajax({
          type: 'POST',
          url: '/login',
          data: $(this).serialize(),
          dataType: 'json',
          success: function(data) {
            if (data.error) {
              $('#errorMessage').text(data.error).show();
            } else if (data.status === 'character_selection_required') {
              window.location.href = '/character_selection';
            } else {
              window.location.href = '/';
            }
          },
          error: function() {
            $('#errorMessage').text("An unexpected error occurred. Please try again.").show();
          }
        });
      });
    });
    </script>
</head>
<body>
    {% if background_url %}
    <img class="login-background" src="{{ background_url }}" alt="">
    {% endif %}
    <div class="login-shell">
      {% if show_title_text %}
      <h1 class="login-title">{{ title }}</h1>
      {% endif %}
      <form class="login-panel" action="/login" method="post" id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" class="form-control" name="username" id="username" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" class="form-control" name="password" id="password" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-login">{{ button_text }}</button>
        <div id="errorMessage" class="login-error" role="alert" style="display: none;"></div>
      </form>
    </div>
</body>
</html>
